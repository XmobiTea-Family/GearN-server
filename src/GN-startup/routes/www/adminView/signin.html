<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>[GN SERVER] Signin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
</head>

<body class="text-center">

    <div class="container">
        <main class="form-signin">
            <form action="./admin/api/signin" method="post" id="signinForm">
                <!-- <img class="mb-4" src="/docs/5.1/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57"> -->
                <h1 class="h3 mb-3 fw-normal">Sign in by Admin account to access GN Control panel page.</h1>

                <div class="form-floating">
                    <input type="text" class="form-control" id="usernameField" name="username">
                    <label for="usernameField">Username</label>
                </div>
                <div class="form-floating mt-3 mb-3">
                    <input type="password" class="form-control" id="passwordField" name="password">
                    <label for="passwordField">Password</label>
                </div>

                <button class="w-100 btn btn-lg btn-primary mb-3" type="submit" form="signinForm">Sign in</button>
            </form>
        </main>
    </div>

    <h6>©2023 <a href="https://xmobitea.com">XmobiTea Family</a></h6>
</body>

</html>
